  biz-501:
    name: "Scaling, M&A & the Cannabis Exit"
    department: bizlaw
    faculty: lex
    credits: 5
    level_req: 11
    duration_hours: 168
    tuition: 900
    prereqs: [biz-401]
    lecture:
      topic: >
        Growth strategy for licensed cannabis operators: multi-state operator
        (MSO) structures, license acquisition vs. organic growth, mergers and
        acquisitions in a state-licensed industry, M&A due diligence, and the
        eventual exit — trade sale, management buyout, or public listing on
        the CSE/OTC markets.
      objectives:
        - "Explain why cannabis M&A is structurally different from conventional M&A."
        - "Describe the three primary MSO expansion strategies and their capital requirements."
        - "List the five most critical due diligence items in a cannabis license acquisition."
        - "Explain why most cannabis companies list on the Canadian Securities Exchange rather than NYSE or NASDAQ."
    modules:
      - id: biz-501-m1
        title: "Multi-State Operator Structures"
        duration_min: 60
        content: >
          A Multi-State Operator holds cannabis licenses in multiple states.
          Because cannabis licenses are state-specific and non-transferable
          across state lines, an MSO cannot simply open branches — it must
          apply for or acquire a separate license in each jurisdiction.
          Three expansion models: Organic (apply for new licenses; low capital
          cost but 12 to 36 month timelines and $5,000 to $250,000 application
          fees per license type); License Acquisition (buy an existing licensed
          operator; faster market entry but you inherit the target's compliance
          history including any unresolved violations); Management Agreement
          (manage operations under contract with the existing licensee, taking
          a management fee, until state approval for ownership transfer is
          obtained — widely used in states with long change-of-ownership
          review periods).
        knowledge_check:
          question: "An MSO acquires a licensed cultivator that has an unresolved Tier 2 compliance violation. What is the primary risk?"
          options:
            - {text: "The violation disappears upon change of ownership.", correct: false}
            - {text: "The violation carries over to the new owner and may trigger a mandatory regulatory disclosure, delaying or blocking the ownership transfer.", correct: true}
            - {text: "The MSO must reapply for the license from scratch.", correct: false}
          explanation: >
            Most state cannabis agencies require disclosure of open enforcement
            actions as part of any change-of-ownership filing. The regulator
            can hold the ownership transfer in abeyance until the violation is
            resolved. Sophisticated buyers include compliance representation-
            and-warranty insurance in large cannabis M&A deals for exactly
            this reason.

      - id: biz-501-m2
        title: "Cannabis M&A Due Diligence"
        duration_min: 60
        content: >
          Cannabis due diligence has five categories not found in conventional
          M&A: (1) License Verification — confirm the target license is active,
          not on suspension or probation, with no pending revocation; obtain
          the license certificate directly from the state portal, not from the
          seller; (2) Compliance History — request all prior inspection reports
          and enforcement actions for the last 3 years; (3) Track-and-Trace
          Audit — pull the target's Metrc history; consistent inventory
          variances over 2 percent are a diversion red flag; (4) §280E Tax
          Exposure — obtain 3 years of tax returns; verify COGS methodology;
          unresolved IRS challenges to COGS allocations become the buyer's
          problem post-close; (5) Change-of-Ownership Pre-Approval — in most
          states the regulatory agency must pre-approve the ownership change
          before it takes legal effect; closing without pre-approval voids
          the license in 14+ states.
        knowledge_check:
          question: "During due diligence you find the target's Metrc reports show consistent 4% inventory variances over 18 months. How should you interpret this?"
          options:
            - {text: "Normal measurement error — not worth flagging.", correct: false}
            - {text: "A significant diversion red flag that requires explanation; condition the deal on a full inventory audit and regulatory clearance.", correct: true}
            - {text: "Automatically disqualifying — walk away immediately.", correct: false}
          explanation: >
            A 4 percent consistent variance is above the 2 to 3 percent
            tolerance most states flag. It could be measurement error, system
            misconfiguration, or actual diversion. A prudent buyer conditions
            the deal on a third-party inventory audit, regulator confirmation
            of no open investigation, and a price adjustment mechanism if
            violations surface post-close. Not an automatic deal-breaker but
            absolutely a flagged condition.

      - id: biz-501-m3
        title: "Public Markets: CSE, OTC & the Cannabis Listing Playbook"
        duration_min: 55
        content: >
          Most US cannabis operators that have gone public list on the Canadian
          Securities Exchange (CSE) rather than NYSE or NASDAQ. The reason is
          structural: NYSE and NASDAQ listing rules require compliance with all
          applicable laws including federal law. Since cannabis is federally
          illegal in the US, NYSE and NASDAQ refuse cannabis listings. The CSE
          has no such restriction for Canadian-law-compliant issuers. US
          cannabis operators list on the CSE as Canadian holding companies,
          then trade over-the-counter in the US on the OTC Markets Pink or
          OTCQB tiers. The result: limited institutional investor access
          (most US mutual funds cannot hold OTC stocks), wide bid-ask spreads,
          and lower liquidity than a major-exchange listing. Effective cannabis
          companies must raise capital at higher cost and dilution than
          comparable non-cannabis businesses — a structural disadvantage that
          persists until federal rescheduling resolves the NYSE/NASDAQ problem.
          Examples: Curaleaf (CURA:CSE), Trulieve (TRUL:CSE), Green Thumb
          Industries (GTII:CSE).
        knowledge_check:
          question: "Why do US cannabis companies typically list on the CSE rather than NYSE?"
          options:
            - {text: "The CSE has lower listing fees.", correct: false}
            - {text: "NYSE and NASDAQ require compliance with all applicable laws including federal law; since cannabis remains federally illegal, they decline cannabis listings.", correct: true}
            - {text: "Canadian investors are larger buyers of cannabis stocks than US investors.", correct: false}
          explanation: >
            This is a direct consequence of Schedule I status. The moment
            federal rescheduling or full descheduling occurs, major-exchange
            listings become legally possible — and most industry analysts
            expect a wave of uplisting and institutional buying to follow.

