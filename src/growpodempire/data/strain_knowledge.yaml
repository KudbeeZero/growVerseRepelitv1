animal-cookies:
  aka: ["Animal Crackers"]
  lineage: "Girl Scout Cookies (2013 HTMC LA cut) × Fire OG Bx3. Bred by BC Bud Depot (Canada). GSC = OG Kush × Durban Poison; Fire OG = OG Kush × SFV OG Kush. The Bx3 (third-generation backcross) of Fire OG amplifies OG potency and bud density."
  origin: "Canada (BC Bud Depot)"
  type: photoperiod
  genotype: "75% Indica / 25% Sativa"
  aroma: [sweet dough, earthy gas, kush spice, vanilla cream, fermented pungency]
  flavor: [cookie sweetness, peppery kush, vanilla, fuel finish]
  effects: [heavy body relaxation, sedating, euphoric, mentally quieting, couch-lock]
  medical: [insomnia, chronic pain, stress, appetite-loss]
  terpenes:
    myrcene: "earthy, musky — primary sedative; GSC and OG Kush double-dose; the couch is real"
    caryophyllene: "peppery-spice — anti-inflammatory bite; Fire OG signature"
    limonene: "citrus — the only uplifting note in an otherwise deeply indica profile"
  cannabinoids: {thc: "19-26%", cbd: "0.5-1%", cbg: "low", thcv: "trace"}
  morphology: "Medium height, stout lateral spread; very dense, slowly developing buds; dark olive green with orange hairs and heavy resin"
  grow:
    difficulty: hard
    environment: [indoor, greenhouse]
    flowering_weeks: "9-10"
    photoperiod: "flip to 12/12; start nutrients low and build gradually — picky feeder; strong airflow mandatory"
    optimal: {temp_c: "20-26", rh_veg_pct: "50-60", rh_flower_pct: "40-50", vpd_kpa: "0.8-1.3", dli: "35-45"}
    yield_indoor_g_m2: "280-340"
    yield_outdoor_g_plant: "350-500"
    height: "medium (1.0-1.6 m)"
    resilience: "low; highly susceptible to botrytis in dense buds; requires strict humidity and nutrition discipline — experienced growers only"
  notes: "The hardest grow and lowest yield in the catalog, offset by a devastatingly effective OG-dominant stone. Not for the impatient — but the experienced grower who hits the harvest window gets some of the most medically potent flowers available."

gary-payton:
  aka: ["GP", "The Glove"]
  lineage: "The Y × Snowman. Collaborative breed by Cookies Fam (Berner) and Powerzzzup Genetics (Kenny Dumetz), developed in Colorado (~2013), public release ~2019. Snowman is a GSC male phenotype; The Y is a proprietary Cookies/Powerzzzup select — believed to be a GSC derivative. Both parents trace to OG Kush × Durban Poison. 1st place 2022 Errl Cup; 2nd place 2022 Emerald Cup."
  origin: "USA (Colorado/California)"
  type: photoperiod
  genotype: "50% Indica / 50% Sativa"
  aroma: [diesel fuel, pine, skunk, black pepper, apricot, citrus]
  flavor: [fruit loops, peach, diesel, pine, peppery finish]
  effects: [giggly, relaxed, euphoric, balanced body-and-mind, versatile]
  medical: [anxiety, depression, stress, mild pain]
  terpenes:
    caryophyllene: "black pepper, gas — dominant; the fuel edge beneath the fruit"
    limonene: "citrus, apricot, peach — the fruity pop that makes this strain unforgettable"
  cannabinoids: {thc: "25-30%", cbd: "<0.5%", cbg: "low", thcv: "trace"}
  morphology: "Medium to tall with dense bud sites; medium internodal spacing; heavy trichome layer; susceptible to moisture retention in thick nugs"
  grow:
    difficulty: hard
    environment: [indoor, greenhouse]
    flowering_weeks: "8-10"
    photoperiod: "flip to 12/12; defoliation and topping required; RH must drop to 40% in flower — botrytis is the #1 killer of this cultivar"
    optimal: {temp_c: "21-29", rh_veg_pct: "55-60", rh_flower_pct: "35-40", vpd_kpa: "1.0-1.5", dli: "40-50"}
    yield_indoor_g_m2: "400-550"
    yield_outdoor_g_plant: "500-700"
    height: "medium-tall (1.2-1.8 m)"
    resilience: "good pest/disease resistance offset by extreme bud-rot susceptibility; strict humidity control non-negotiable"
  notes: "Named for the Hall of Famer's legendary defense — and this strain defends its right to the top shelf. The Cookies × Powerzzzup collaboration that delivers both fruit-loops aroma and serious potency. Multiple Cannabis Cup wins confirm the hype."

dam-diddy-purp:
  aka: ["DDP", "Dam Diddy"]
  lineage: "Granddaddy Purple × Permanent Marker. First strain ever bred in the GROWv2 simulation. GDP brings deep indica body, vivid anthocyanin-rich purple expression, and that legendary grape-candy nose; Permanent Marker's three-generation Gelato stack pushes the THCA ceiling to an extraordinary 38.9% — beyond any commercial test result on record. A legend born in the pod."
  origin: "GROWv2 Simulation (first ever player-bred strain)"
  type: photoperiod
  genotype: "80% Indica / 20% Sativa"
  aroma: [grape candy, vanilla gas, deep purple earth, sweet berry, mint-spice]
  flavor: [grape cream, vanilla cookie, peppery kush, purple berry finish]
  effects: [powerful euphoric onset, deeply sedating, heavy body-lock, dreamlike mental state]
  medical: [severe insomnia, chronic pain, extreme stress]
  terpenes:
    myrcene: "grape-earth, deeply musky — GDP's hallmark doubled; maximum couch-lock contribution"
    caryophyllene: "peppery vanilla-spice — the Permanent Marker inheritance stacked under the purple"
    limonene: "citrus — the only thing preventing complete sedation at lower doses"
  cannabinoids: {thc: "38.9% THCA (GROWv2 sim record)", cbd: "~1%", cbg: "moderate", thcv: "trace"}
  morphology: "Dense indica structure with vivid purple coloration throughout; extremely thick trichome layer; broad leaf spread; heavy bud weight"
  grow:
    difficulty: moderate
    environment: [indoor, greenhouse]
    flowering_weeks: "9"
    photoperiod: "flip to 12/12; cool nights deepen the purple; stable indoor environment preserves the legendary THC expression"
    optimal: {temp_c: "20-24", rh_veg_pct: "55-65", rh_flower_pct: "40-50", vpd_kpa: "0.8-1.3", dli: "35-45"}
    yield_indoor_g_m2: "380-450"
    yield_outdoor_g_plant: "400-550"
    height: "medium (1.0-1.5 m)"
    resilience: "moderate; inherits GDP's mold awareness and Permanent Marker's vigorous growth; manageable with standard indoor protocol"
  notes: "The first strain ever to emerge from the GROWv2 simulation. 38.9% THCA — a number that doesn't exist in the commercial market — born from the marriage of Granddaddy Purple's purple genetics and Permanent Marker's Gelato-stacked THC ceiling. A piece of GROWv2 history."
